<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>Archify visual-check · ops-agent-flow.html</title>
    <style>
    * {
      box-sizing: border-box;
    }
    body {
      padding: 24px;
      margin: 0;
      font:
        14px / 1.5 ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
      color: #172033;
      background: #e9eef5;
    }
    header {
      max-width: 1500px;
      margin: 0 auto 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
    }
    p {
      margin: 0;
      color: #526176;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      max-width: 1500px;
      margin: auto;
    }
    figure {
      padding: 10px;
      margin: 0;
      background: white;
      border: 1px solid #c9d4e3;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #e2e8f0;
    }
    figcaption {
      padding: 9px 4px 2px;
      color: #526176;
    }
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    </style>
  </head>
  <body>
    <header>
      <h1>Archify visual-check</h1>
      <p>
        ops-agent-flow.html · automated containment pass · visual review pending
      </p>
    </header>
    <main class="grid">
      <figure>
        <img
          alt="light 1440 by 900"
          src="ops-agent-flow.visual-check.1440x900.light.png"
        >
        <figcaption>
          <strong>LIGHT</strong>
          · 1440×900 · containment pass
        </figcaption>
      </figure>
      <figure>
        <img
          alt="dark 1440 by 900"
          src="ops-agent-flow.visual-check.1440x900.dark.png"
        >
        <figcaption>
          <strong>DARK</strong>
          · 1440×900 · containment pass
        </figcaption>
      </figure>
      <figure>
        <img
          alt="light 2048 by 1320"
          src="ops-agent-flow.visual-check.2048x1320.light.png"
        >
        <figcaption>
          <strong>LIGHT</strong>
          · 2048×1320 · containment pass
        </figcaption>
      </figure>
      <figure>
        <img
          alt="dark 2048 by 1320"
          src="ops-agent-flow.visual-check.2048x1320.dark.png"
        >
        <figcaption>
          <strong>DARK</strong>
          · 2048×1320 · containment pass
        </figcaption>
      </figure>
    </main>
  </body>
</html>
